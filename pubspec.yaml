name: flutter_mux_workspace
publish_to: none

environment:
  sdk: ^3.10.1

# Glob paths need Dart 3.11; list members explicitly.
workspace:
  - packages/mux
  - packages/flutter_mux
  - packages/mux_generator
  - example

melos:
  command:
    version:
      mode: fixed
      branch: main
  scripts:
    test:dart:
      description: Run `dart test` in pure Dart packages.
      exec: dart test
      packageFilters:
        dirExists: test
        flutter: false
    test:flutter:
      description: Run `flutter test` in Flutter packages.
      exec: flutter test
      packageFilters:
        dirExists: test
        flutter: true
    generate:
      description: Run build_runner in packages that use mux_generator.
      exec: dart run build_runner build
      packageFilters:
        dependsOn: mux_generator
dev_dependencies:
  melos: ^8.7.0
