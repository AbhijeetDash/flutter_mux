name: mux_generator
description: "build_runner generator for mux: wires @WithService services into one channel."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.1

resolution: workspace

# analyzer stays below 9: test 1.26.x (the newest compatible with Flutter's
# pinned test_api on Dart 3.10) requires analyzer <9.
dependencies:
  analyzer: ">=8.1.1 <9.0.0"
  build: ^4.0.7
  glob: ^2.2.0
  source_gen: ^4.2.4

dev_dependencies:
  build_test: ^3.5.16
  lints: ^6.1.0
  test: ^1.26.3
