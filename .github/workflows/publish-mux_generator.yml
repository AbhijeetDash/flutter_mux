name: Publish mux_generator

# Requires automated publishing on pub.dev/packages/mux_generator/admin with the
# tag pattern `mux_generator-v{{version}}`. Push after the matching mux version
# is live on pub.dev.
on:
  push:
    tags:
      - 'mux_generator-v[0-9]*'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/mux_generator
